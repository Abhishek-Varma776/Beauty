<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <!-- Elegant premium gold gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe89e" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa8010" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Elegant single-path crown for clean rendering at small sizes -->
    <path d="M 6,36 C 6,36 12,38 24,38 C 36,38 42,36 42,36 L 38.5,19 L 30.5,27 L 24,11 L 17.5,27 L 9.5,19 Z" fill="url(#gold)" stroke="#ffe89e" stroke-width="1.5" stroke-linejoin="round" />
    
    <!-- Pearls on the 3 main tips -->
    <circle cx="9.5" cy="19" r="2.5" fill="#ffffff" stroke="#aa8010" stroke-width="0.5" />
    <circle cx="24" cy="11" r="3" fill="#ffffff" stroke="#aa8010" stroke-width="0.5" />
    <circle cx="38.5" cy="19" r="2.5" fill="#ffffff" stroke="#aa8010" stroke-width="0.5" />
    
    <!-- Luxurious ruby jewel in the center -->
    <circle cx="24" cy="31" r="2.5" fill="#e53e3e" />
    
    <!-- Small emerald jewels on the sides -->
    <circle cx="15" cy="32.5" r="1.8" fill="#319795" />
    <circle cx="33" cy="32.5" r="1.8" fill="#319795" />
  </g>
</svg>